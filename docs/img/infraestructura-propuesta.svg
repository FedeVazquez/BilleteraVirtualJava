<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <title>Digital Money House - Boceto de la infraestructura propuesta</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1000" height="640" fill="#ffffff"/>

  <!-- internet -->
  <rect x="300" y="14" width="250" height="44" rx="22" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="425" y="41" text-anchor="middle" font-weight="600" fill="#7c2d12">Internet · usuarios (web y móvil)</text>

  <!-- red privada virtual -->
  <rect x="20" y="78" width="740" height="548" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="36" y="100" font-weight="600" fill="#334155">Red privada virtual (VPC) — 2 zonas de disponibilidad: cada servicio corre en 2 instancias, una por zona</text>

  <!-- subred publica -->
  <rect x="40" y="112" width="700" height="96" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="54" y="132" font-weight="600" fill="#1e3a8a" font-size="12">Subred pública (DMZ) — lo único accesible desde Internet</text>
  <rect x="300" y="144" width="250" height="52" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="425" y="166" text-anchor="middle" font-weight="600" fill="#1e3a8a">Balanceador de carga</text>
  <text x="425" y="184" text-anchor="middle" fill="#1e3a8a" font-size="12">HTTPS :443 · certificado TLS · WAF</text>
  <rect x="60" y="144" width="170" height="52" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="145" y="166" text-anchor="middle" font-weight="600" fill="#1e3a8a">Bastión / VPN</text>
  <text x="145" y="184" text-anchor="middle" fill="#1e3a8a" font-size="12">acceso de administración</text>
  <rect x="600" y="144" width="124" height="52" rx="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.2"/>
  <text x="662" y="166" text-anchor="middle" font-weight="600" fill="#1e3a8a">NAT</text>
  <text x="662" y="184" text-anchor="middle" fill="#1e3a8a" font-size="12">salida a Internet</text>

  <!-- subred de aplicacion -->
  <rect x="40" y="226" width="700" height="230" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
  <text x="54" y="246" font-weight="600" fill="#064e3b" font-size="12">Subred privada de aplicación (sin IP pública)</text>
  <rect x="300" y="258" width="250" height="50" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.5"/>
  <text x="425" y="279" text-anchor="middle" font-weight="600" fill="#064e3b">api-gateway × 2</text>
  <text x="425" y="296" text-anchor="middle" fill="#064e3b" font-size="12">única entrada a los servicios</text>
  <g fill="#ffffff" stroke="#047857" stroke-width="1.5">
    <rect x="120" y="352" width="170" height="50" rx="8"/>
    <rect x="340" y="352" width="170" height="50" rx="8"/>
    <rect x="560" y="352" width="170" height="50" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#064e3b">
    <text x="205" y="373" font-weight="600">auth-service × 2</text>
    <text x="205" y="390" font-size="12">login, tokens</text>
    <text x="425" y="373" font-weight="600">users-service × 2</text>
    <text x="425" y="390" font-size="12">usuarios, roles</text>
    <text x="645" y="373" font-weight="600">account-service × 2</text>
    <text x="645" y="390" font-size="12">cuentas, CVU, alias</text>
  </g>
  <rect x="54" y="262" width="150" height="44" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="129" y="281" text-anchor="middle" font-weight="600" fill="#4c1d95">eureka-server × 2</text>
  <text x="129" y="297" text-anchor="middle" fill="#4c1d95" font-size="12">service discovery</text>

  <!-- subred de datos -->
  <rect x="40" y="474" width="700" height="136" rx="10" fill="#fefce8" stroke="#a16207" stroke-width="1.2"/>
  <text x="54" y="596" font-weight="600" fill="#713f12" font-size="12">Subred privada de datos — solo acepta conexiones desde la subred de aplicación</text>
  <rect x="70" y="504" width="270" height="64" rx="8" fill="#ffffff" stroke="#a16207" stroke-width="1.5"/>
  <text x="205" y="526" text-anchor="middle" font-weight="600" fill="#713f12">MySQL primario (disco cifrado)</text>
  <text x="205" y="546" text-anchor="middle" fill="#713f12" font-size="12">dmh_users · dmh_auth · dmh_accounts</text>
  <rect x="420" y="504" width="150" height="64" rx="8" fill="#ffffff" stroke="#a16207" stroke-width="1.5"/>
  <text x="495" y="531" text-anchor="middle" font-weight="600" fill="#713f12">MySQL réplica</text>
  <text x="495" y="549" text-anchor="middle" fill="#713f12" font-size="12">otra zona · failover</text>
  <rect x="594" y="504" width="132" height="64" rx="8" fill="#ffffff" stroke="#a16207" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="660" y="526" text-anchor="middle" font-weight="600" fill="#713f12">Redis (a futuro)</text>
  <text x="660" y="543" text-anchor="middle" fill="#713f12" font-size="11.5">tokens invalidados;</text>
  <text x="660" y="558" text-anchor="middle" fill="#713f12" font-size="11.5">hoy están en MySQL</text>

  <!-- servicios gestionados -->
  <rect x="780" y="78" width="204" height="548" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
  <text x="882" y="100" text-anchor="middle" font-weight="600" fill="#334155">Servicios de soporte</text>
  <g fill="#ffffff" stroke="#64748b" stroke-width="1.2">
    <rect x="796" y="116" width="172" height="64" rx="8"/>
    <rect x="796" y="196" width="172" height="64" rx="8"/>
    <rect x="796" y="276" width="172" height="64" rx="8"/>
    <rect x="796" y="356" width="172" height="64" rx="8"/>
    <rect x="796" y="436" width="172" height="64" rx="8"/>
    <rect x="796" y="516" width="172" height="64" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#334155">
    <text x="882" y="141" font-weight="600">Servicio de correo</text>
    <text x="882" y="159" font-size="12">SMTP real (reemplaza</text>
    <text x="882" y="173" font-size="12">a MailHog)</text>
    <text x="882" y="221" font-weight="600">Gestor de secretos</text>
    <text x="882" y="239" font-size="12">JWT_SECRET, claves de</text>
    <text x="882" y="253" font-size="12">base y clave interna</text>
    <text x="882" y="301" font-weight="600" font-size="12.5">Almacenamiento de objetos</text>
    <text x="882" y="319" font-size="12">backups diarios de MySQL</text>
    <text x="882" y="333" font-size="12">y archivo de logs</text>
    <text x="882" y="381" font-weight="600">Logs y monitoreo</text>
    <text x="882" y="399" font-size="12">logs centralizados,</text>
    <text x="882" y="413" font-size="12">métricas y alertas</text>
    <text x="882" y="461" font-weight="600">Registro de imágenes</text>
    <text x="882" y="479" font-size="12">imágenes Docker</text>
    <text x="882" y="493" font-size="12">versionadas</text>
    <text x="882" y="541" font-weight="600">CI/CD</text>
    <text x="882" y="559" font-size="12">Git: test → build →</text>
    <text x="882" y="573" font-size="12">despliegue</text>
  </g>

  <!-- flechas -->
  <g stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <line x1="425" y1="58" x2="425" y2="142"/>
    <line x1="425" y1="196" x2="425" y2="256"/>
    <line x1="400" y1="308" x2="230" y2="350"/>
    <line x1="425" y1="308" x2="425" y2="350"/>
    <line x1="450" y1="308" x2="620" y2="350"/>
    <line x1="205" y1="402" x2="160" y2="502"/>
    <line x1="425" y1="402" x2="240" y2="502"/>
    <line x1="645" y1="402" x2="320" y2="502"/>
    <line x1="340" y1="540" x2="418" y2="540"/>
  </g>
  <g fill="#334155" font-size="11.5">
    <text x="433" y="72">HTTPS</text>
    <text x="433" y="222">HTTP interno</text>
    <text x="379" y="532" font-size="10.5" text-anchor="middle">replicación</text>
  </g>
</svg>
