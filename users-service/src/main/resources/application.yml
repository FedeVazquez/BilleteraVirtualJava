server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: users-service
  cloud:
    loadbalancer:
      cache:
        # Lista de instancias en cache por 5 s (por defecto 35 s).
        ttl: 5s
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:dmh_users}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:dmh}
    password: ${DB_PASSWORD:dmh_password}
  jpa:
    open-in-view: false
    hibernate:
      # Spring Data JPA crea/actualiza las tablas a partir de las entidades.
      ddl-auto: update
  mail:
    # En local apunta a MailHog (SMTP falso): los mails se ven en http://localhost:8025
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    # Vacios en local (MailHog no pide usuario). En AWS: credenciales SMTP de Amazon SES u otro proveedor.
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    # Consultar el registro cada 5 s (por defecto 30 s): los servicios recien levantados se ven antes.
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      # Que el SMTP este caido no debe marcar el servicio como caido.
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # Valores por defecto SOLO para desarrollo local. En cualquier otro entorno se
    # sobreescriben con las variables de entorno JWT_SECRET e INTERNAL_API_KEY.
    secret: ${JWT_SECRET:dmh-dev-secret-cambiar-en-produccion-0123456789}
  internal-api-key: ${INTERNAL_API_KEY:dmh-dev-internal-key}
  mail:
    from: ${MAIL_FROM:no-reply@digitalmoneyhouse.com}
  email-verification:
    code-ttl-minutes: 15
    max-attempts: 5
  password-reset:
    token-ttl-minutes: 30
    # Pantalla donde el usuario ingresa (y repite) la nueva contraseña. Recibe ?token=...
    link-base-url: ${PASSWORD_RESET_URL:http://localhost:8090/auth/reset-password.html}
  openapi:
    server-url: ${GATEWAY_URL:http://localhost:8090}
