<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Digital Money House - Nueva contraseña</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #201f22; color: #f3f3f3; margin: 0;
               min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        main { background: #2d2c30; padding: 2rem; border-radius: 12px; width: min(90vw, 360px); }
        h1 { font-size: 1.25rem; margin: 0 0 1.25rem; color: #c1fd35; }
        label { display: block; font-size: .875rem; margin: 1rem 0 .25rem; }
        input { width: 100%; box-sizing: border-box; padding: .625rem; border-radius: 8px; border: 1px solid #555;
                background: #fff; font-size: 1rem; }
        button { width: 100%; margin-top: 1.5rem; padding: .75rem; border: 0; border-radius: 8px;
                 background: #c1fd35; color: #201f22; font-size: 1rem; font-weight: 600; cursor: pointer; }
        button:disabled { opacity: .6; cursor: wait; }
        #message { margin-top: 1rem; font-size: .875rem; min-height: 1.25rem; }
        #message.error { color: #ff8a80; }
        #message.ok { color: #c1fd35; }
    </style>
</head>
<body>
<main>
    <h1>Elegí tu nueva contraseña</h1>
    <form id="form" novalidate>
        <label for="password">Nueva contraseña</label>
        <input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
        <label for="passwordConfirm">Repetí la contraseña</label>
        <input id="passwordConfirm" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
        <button id="submit" type="submit">Cambiar contraseña</button>
        <p id="message" role="alert"></p>
    </form>
</main>
<script>
    const form = document.getElementById('form');
    const message = document.getElementById('message');
    const button = document.getElementById('submit');
    const token = new URLSearchParams(window.location.search).get('token');

    function show(text, kind) {
        message.textContent = text;
        message.className = kind;
    }

    if (!token) {
        show('El enlace no es válido. Pedí uno nuevo.', 'error');
        button.disabled = true;
    }

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const password = document.getElementById('password').value;
        const passwordConfirm = document.getElementById('passwordConfirm').value;
        if (password.length < 8) {
            return show('La contraseña debe tener al menos 8 caracteres.', 'error');
        }
        if (password !== passwordConfirm) {
            return show('Las contraseñas no coinciden.', 'error');
        }
        button.disabled = true;
        try {
            const response = await fetch('/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, password, passwordConfirm })
            });
            const body = await response.json().catch(() => ({}));
            if (response.ok) {
                show(body.message || 'Contraseña actualizada.', 'ok');
                form.reset();
            } else {
                show((body.details && body.details.join(' ')) || body.message || 'No se pudo cambiar la contraseña.', 'error');
                button.disabled = false;
            }
        } catch (e) {
            show('No se pudo conectar con el servidor. Intentá de nuevo.', 'error');
            button.disabled = false;
        }
    });
</script>
</body>
</html>
