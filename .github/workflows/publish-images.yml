# Construye las imagenes Docker de los 5 microservicios y las publica para deployar en AWS.
# No corre en cada push: solo a mano (Actions -> Publicar imagenes -> Run workflow) o al crear un tag v*.
#
# Destinos:
#  - GitHub Container Registry (ghcr.io): siempre. No necesita configuracion.
#  - Amazon ECR: solo si en Settings -> Secrets and variables -> Actions se definen las variables
#    AWS_REGION y AWS_ECR_REGISTRY y el secreto AWS_ROLE_ARN (rol de IAM con OIDC). Ver docs/deploy-aws.md.
name: Publicar imagenes

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write   # para autenticarse en AWS con OIDC, sin claves de acceso guardadas

jobs:
  publicar:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [eureka-server, api-gateway, auth-service, users-service, account-service]
    steps:
      - uses: actions/checkout@v5

      - name: Nombre y version de la imagen
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version="${GITHUB_REF_NAME//\//-}"
          echo "ghcr=ghcr.io/${owner}/dmh-${{ matrix.module }}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login en AWS (opcional)
        if: ${{ vars.AWS_ECR_REGISTRY != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login en Amazon ECR (opcional)
        if: ${{ vars.AWS_ECR_REGISTRY != '' }}
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: MODULE=${{ matrix.module }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.ghcr }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.ghcr }}:latest
            ${{ vars.AWS_ECR_REGISTRY != '' && format('{0}/dmh-{1}:{2}', vars.AWS_ECR_REGISTRY, matrix.module, steps.meta.outputs.version) || '' }}
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}
